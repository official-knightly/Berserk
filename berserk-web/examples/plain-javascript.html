<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berserk API example</title></head>
<body>
  <button id="move">Get best move</button>
  <pre id="result">Ready</pre>
  <script>
    const API_URL = "https://YOUR-API-DOMAIN.example.com";
    document.querySelector("#move").addEventListener("click", async () => {
      const result = document.querySelector("#result");
      result.textContent = "Thinking…";
      try {
        const response = await fetch(API_URL + "/bestmove", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
            movetime: 1000
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || response.statusText);
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) { result.textContent = String(error); }
    });
  </script>
</body>
</html>
