name: Temporary Berserk WASM build
on:
  push:
    branches:
      - temp-wasm-build-20261026
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install nightly Rust and WASM target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - name: Build Berserk WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          # This compatibility edit exists only on the runner; it is not committed to source.
          sed -i 's/edition = "2026"/edition = "2024"/' Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --no-default-features
          WB_VERSION="$(awk '/^name = "wasm-bindgen"$/{getline; if ($1 == "version") {gsub(/"/, "", $3); print $3; exit}}' Cargo.lock)"
          test -n "$WB_VERSION"
          cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
          mkdir -p wasm
          wasm-bindgen --target web --out-dir wasm --out-name berserk target/wasm32-unknown-unknown/release/berserk.wasm
          cat > wasm/README.md <<'EOF'
          # Berserk WebAssembly

          These files are generated from this repository's Berserk Rust engine. Do not edit the generated
          berserk.js or berserk_bg.wasm manually; rebuild them from the source to update the engine.

          ## Add to a website

          Copy berserk.js and berserk_bg.wasm into the same directory in your website. Serve them over
          HTTP(S) (not directly from file://), then import the generated JavaScript module:

          ```js
          import init, { Engine } from "./berserk.js";

          await init();
          const engine = new Engine();
          engine.set_position("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
          engine.go_uci(12, 0, 1, (line) => console.log(line));
          console.log("Best move:", engine.last_bestmove());
          console.log("Score:", engine.last_score());
          ```

          The API is synchronous during search; run it in a Web Worker to avoid blocking your page. API
          signatures are generated from src/wasm.rs. This build disables Syzygy tablebase support.
          Berserk is GPL-3.0; preserve the project's license and attribution when redistributing it.
          EOF
          ls -lh wasm
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: berserk-wasm-build
          path: wasm/
          if-no-files-found: error
          retention-days: 7

      - name: Checkout main for publishing only wasm/
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          token: ${{ github.token }}
      - name: Publish only wasm/ to main
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p main/wasm
          cp -a wasm/. main/wasm/
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm/
          if git diff --cached --quiet; then
            echo "No wasm/ changes to publish."
            exit 0
          fi
          git commit -m "Add compiled Berserk WebAssembly browser build"
          git push origin HEAD:main
