name: Temporary Berserk WASM build
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install nightly Rust and WASM target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - name: Build Berserk WebAssembly
        shell: bash
        run: |
          set +e
          mkdir -p wasm
          (
            set -euxo pipefail
            # Runner-only compatibility edit; never committed to the repository source.
            sed -i 's/edition = "2026"/edition = "2024"/' Cargo.toml
            cargo build --release --target wasm32-unknown-unknown --no-default-features
            WB_VERSION="$(awk '/^name = "wasm-bindgen"$/{getline; if ($1 == "version") {gsub(/"/, "", $3); print $3; exit}}' Cargo.lock)"
            test -n "$WB_VERSION"
            cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
            wasm-bindgen --target web --out-dir wasm --out-name berserk target/wasm32-unknown-unknown/release/berserk.wasm
            cat > wasm/README.md <<'EOF'
          # Berserk WebAssembly

          This folder contains the generated browser build of the Berserk Rust chess engine.
          Keep berserk.js and berserk_bg.wasm in the same directory on your website. Serve the
          files over HTTP(S), then import the JavaScript module:

          ```js
          import init, { Engine } from "./berserk.js";

          await init();
          const engine = new Engine();
          engine.set_position("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
          engine.go_uci(12, 0, 1, (line) => console.log(line));
          console.log(engine.last_bestmove(), engine.last_score());
          ```

          Search currently runs synchronously, so call it from a Web Worker to keep the page responsive.
          The API is generated from src/wasm.rs. This build disables Syzygy tablebase support.
          Preserve the project's GPL-3.0 license and attribution when redistributing the engine.
          EOF
          ) > wasm/BUILD_LOG.txt 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then
            echo "SUCCESS" > wasm/BUILD_STATUS.txt
          else
            printf 'FAILED (exit code %s)\n' "$result" > wasm/BUILD_STATUS.txt
          fi
          cat wasm/BUILD_STATUS.txt
      - name: Ensure a build report exists
        if: always()
        shell: bash
        run: |
          mkdir -p wasm
          test -f wasm/BUILD_STATUS.txt || echo "FAILED before compile step; check Actions logs" > wasm/BUILD_STATUS.txt
          test -f wasm/BUILD_LOG.txt || echo "No compiler log was produced." > wasm/BUILD_LOG.txt
      - name: Upload build report and generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berserk-wasm-build-report
          path: wasm/
          if-no-files-found: error
          retention-days: 7
      - name: Checkout main for publishing only wasm/
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          token: ${{ github.token }}
      - name: Publish build output or temporary error report
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p main/wasm
          if grep -q '^SUCCESS' wasm/BUILD_STATUS.txt; then
            rm -f wasm/BUILD_LOG.txt wasm/BUILD_STATUS.txt
            cp -a wasm/. main/wasm/
            git -C main rm -f .github/workflows/wasm-build-temporary.yml
          else
            cp wasm/BUILD_STATUS.txt wasm/BUILD_LOG.txt main/wasm/
          fi
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm/
          git add -u .github/workflows/wasm-build-temporary.yml || true
          if git diff --cached --quiet; then
            echo "No wasm/ changes to publish."
            exit 0
          fi
          git commit -m "Add Berserk WASM browser build"
          git push origin HEAD:main
