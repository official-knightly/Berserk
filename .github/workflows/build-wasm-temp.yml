name: Build Berserk WASM (temporary)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wasm-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berserk-wasm-build
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust nightly and WASM target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y clang curl

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked

      - name: Normalize unsupported package edition in the build workspace only
        run: sed -i 's/edition = "2026"/edition = "2024"/' Cargo.toml

      - name: Build Berserk for WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features

      - name: Generate JavaScript bindings
        run: wasm-bindgen --target web --out-dir wasm --out-name berserk target/wasm32-unknown-unknown/release/berserk.wasm

      - name: Add website integration example and README
        shell: bash
        run: |
          cat > wasm/example.js <<'EOF'
          import init, { Engine } from "./berserk.js";

          export async function createBerserkEngine() {
            await init();
            return new Engine();
          }

          // Example:
          // const engine = await createBerserkEngine();
          // engine.set_position("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
          // engine.go_uci(12, 0, 1, (info) => console.log(info));
          // console.log(engine.last_bestmove(), engine.last_score());
          EOF
          cat > wasm/README.md <<'EOF'
          # Berserk WebAssembly

          This folder contains the compiled Berserk chess engine and the JavaScript bindings generated from the existing Rust WASM API. The source engine and all pre-existing project files are left unchanged.

          ## Files

          - `berserk_bg.wasm`: compiled WebAssembly engine.
          - `berserk.js`: JavaScript glue generated by `wasm-bindgen`.
          - `example.js`: small browser-module integration helper.
          - `README.md`: these instructions.

          ## Use in a website

          Serve this folder over HTTP(S) (ES modules and WebAssembly generally will not load from a `file://` URL). Then import the helper from your website:

          ```js
          import { createBerserkEngine } from "./wasm/example.js";

          const engine = await createBerserkEngine();
          engine.set_position("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
          engine.go_uci(12, 0, 1, (info) => console.log("Berserk:", info));
          console.log("Best move:", engine.last_bestmove());
          console.log("Score:", engine.last_score());
          ```

          `go_uci(depth, nodes, multiPv, onInfo)` searches by depth when `nodes` is zero. For a time-limited search use `go_movetime(milliseconds, multiPv, onInfo)`. Call `set_position(fen)` to analyze a FEN, `make_move(uciMove)` to apply a UCI move, and `evaluate()` to get the current static evaluation.

          Use only positions and engine output appropriate for your site's rules and intended use. This is a browser build; performance and threading depend on the browser and hosting headers.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm
          git rm .github/workflows/build-wasm-temp.yml
          git commit -m "Add compiled Berserk WebAssembly and JavaScript bindings"
          git push
